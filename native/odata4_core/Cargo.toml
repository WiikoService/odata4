[package]
name = "odata4_core"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "MIT"
description = "Разбор параметров запроса OData v4 (дерево как у OData4_Разбор)"

[dependencies]
# Без фичи preserve_order намеренно. Она тянет indexmap и hashbrown, а те засеивают свой генератор
# на каждый образ библиотеки. Платформа 1С грузит свежий образ компоненты на каждый объект
# `Новый("AddIn…")`, и примерно на 475-м таком цикле процесс 1С умирал внутри нашей библиотеки
# (0xC0000409); без фичи тот же цикл проходит 3000 повторений. Порядок ключей от этого не страдает:
# канон требует ключей по возрастанию, и BTreeMap обычного serde_json даёт ровно его — все 150 общих
# примеров сходятся.
serde_json = "1"

[dev-dependencies]
proptest = "1"
